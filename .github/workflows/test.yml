name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run bats tests
        run: bats tests/unit/

  # Runs the composite action itself, so a change to action.yaml (such as a
  # pinned-action bump) is exercised by a check. Output stays on the runner.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action
        uses: ./
        with:
          OUTPUT_DIR: ${{ runner.temp }}/registry

      - name: Check the registry output
        run: |
          jq -e '.repo_count > 0 and (.repos | length) == .repo_count' "$RUNNER_TEMP/registry/index.json"
          grep -qF "(https://github.com/$GITHUB_REPOSITORY)" "$RUNNER_TEMP/registry/REPO_REGISTRY.md"
